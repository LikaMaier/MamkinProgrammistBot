<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Установка ПО</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --page:var(--tg-theme-secondary-bg-color,#f2f3f7);
  --card:var(--tg-theme-section-bg-color,var(--tg-theme-bg-color,#ffffff));
  --text:var(--tg-theme-text-color,#14161a);
  --hint:var(--tg-theme-hint-color,#8a909c);
  --accent:var(--tg-theme-button-color,#3d7bfd);
  --accent-text:var(--tg-theme-button-text-color,#ffffff);
  --link:var(--tg-theme-link-color,#3d7bfd);
  --danger:#e5484d;--ok:#2fb36b;--warn:#f0a020;
  --soft:color-mix(in srgb,var(--accent) 12%,transparent);
  --line:color-mix(in srgb,var(--hint) 22%,transparent);
}
@media (prefers-color-scheme:dark){:root:not([data-tg]){--page:#0f1115;--card:#1a1d24;--text:#eef1f6;--hint:#8b93a3}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--page);color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Helvetica,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
#app{max-width:640px;margin:0 auto;padding:10px 16px 120px}
h2{font-size:20px;margin:6px 0 4px}
.hint{color:var(--hint);font-size:13px;margin:4px 0 12px}
.small{font-size:12px;margin:8px 0 0}
.grow{flex:1;min-width:0}
.sec{font-size:13px;font-weight:700;color:var(--hint);text-transform:uppercase;letter-spacing:.04em;margin:18px 4px 8px}

.tabs{display:flex;gap:4px;background:var(--card);padding:4px;border-radius:14px;position:sticky;top:8px;z-index:5;margin-bottom:14px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.tab{flex:1;border:0;background:none;color:var(--hint);padding:9px 4px;border-radius:10px;font-weight:600;font-size:14px;white-space:nowrap}
.tab.on{background:var(--accent);color:var(--accent-text)}

.steps{display:flex;align-items:center;gap:6px;margin:2px 0 14px;font-size:12px;color:var(--hint)}
.steps .back{border:0;background:var(--card);width:30px;height:30px;border-radius:10px;font-size:18px;line-height:1;flex:none}
.steps b{color:var(--text);font-size:15px}
.st{display:flex;align-items:center;gap:5px;flex:1;white-space:nowrap}
.st span{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--line);font-size:11px;font-weight:700;flex:none}
.st.done span,.st.cur span{background:var(--accent);color:var(--accent-text)}
.st.cur{color:var(--text);font-weight:600}

.hero{padding:14px 16px;border-radius:18px;background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 50%,#8a5cff));color:#fff;margin-bottom:6px}
.hero-t{font-size:18px;font-weight:800;margin-bottom:4px}
.hero-s{font-size:13.5px;opacity:.92}

.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:10px}
.svc{display:flex;gap:12px;align-items:flex-start;border:2px solid transparent;transition:border-color .15s,transform .1s;cursor:pointer}
.svc:active{transform:scale(.99)}
.svc.on{border-color:var(--accent)}
.emo{font-size:24px;width:46px;height:46px;border-radius:13px;background:var(--soft);display:grid;place-items:center;flex:none}
.emo.sm{width:38px;height:38px;font-size:20px;border-radius:11px}
.svc-t{font-weight:650;font-size:15.5px}
.svc-d{color:var(--hint);font-size:13px;margin-top:3px}
.svc-m{display:flex;gap:10px;align-items:center;margin-top:8px;font-size:14px}
.svc-m span{color:var(--hint);font-size:13px}
.chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;color:var(--accent-text);font-size:13px;font-weight:800;margin-top:10px}
.svc.on .chk{background:var(--accent);border-color:var(--accent)}

.cal-h{font-weight:700;margin-bottom:10px}
.cal-m{font-size:13px;font-weight:700;color:var(--hint);margin:6px 0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:8px}
.cal-w{text-align:center;font-size:11px;color:var(--hint);padding-bottom:2px}
.day{position:relative;aspect-ratio:1;border:0;border-radius:12px;background:var(--soft);font-weight:650;font-size:15px;max-height:52px}
.day:disabled{background:none;color:var(--hint);opacity:.45;cursor:default}
.day.on{background:var(--accent);color:var(--accent-text)}
.day.off{background:color-mix(in srgb,var(--danger) 16%,transparent);color:var(--danger)}
.day.wkend{background:var(--line);color:var(--hint)}
.day.on.off,.day.on.wkend{outline:2px solid var(--accent);outline-offset:1px}
.dot{position:absolute;bottom:5px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--warn)}

.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.slot{border:1.5px solid var(--line);background:none;border-radius:12px;padding:10px 4px;font-weight:650;display:flex;flex-direction:column;align-items:center;gap:2px}
.slot small{font-size:10.5px;font-weight:500;color:var(--hint)}
.slot.free{border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.slot.on{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
.slot:disabled{opacity:.38;text-decoration:line-through;cursor:default}
.slot.a-booked{background:color-mix(in srgb,var(--warn) 18%,transparent);border-color:transparent}
.slot.a-blocked{background:var(--line);border-color:transparent;color:var(--hint)}
.slot.a-past{opacity:.35}
.legend{display:flex;gap:14px;font-size:12px;color:var(--hint);margin-top:10px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}

.row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;align-items:center}
.row span{color:var(--hint)}
.row b{text-align:right;white-space:nowrap}
.row.total{border-top:1px solid var(--line);margin-top:6px;padding-top:12px;font-size:17px}
.row.total span{color:var(--text);font-weight:700}
.lbl{display:block;font-size:13px;color:var(--hint);margin:10px 0 6px}
.lbl:first-child{margin-top:0}
.inp{width:100%;border:1.5px solid var(--line);background:var(--page);border-radius:12px;padding:11px 12px;outline:none;resize:vertical}
.inp:focus{border-color:var(--accent)}
.inp.t{width:auto;flex:1;min-width:0;padding:8px}
.link{border:0;background:none;color:var(--link);padding:6px 0 0;font-weight:600}

.btn{border:0;background:var(--accent);color:var(--accent-text);border-radius:12px;padding:12px 16px;font-weight:700}
.btn.sm{padding:8px 12px;font-size:13.5px;border-radius:10px}
.btn.ghost{background:var(--soft);color:var(--accent)}
.btn.danger{background:color-mix(in srgb,var(--danger) 14%,transparent);color:var(--danger)}
.btn.wide{width:100%;margin:6px 0 4px}
.btn:disabled{opacity:.5}

.ord-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.ord-when{font-weight:600}
.ord-items{color:var(--hint);font-size:13.5px;margin:4px 0}
.ord-sum{font-weight:800;font-size:16px}
.ord-who{font-size:14px;margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.ord-who a{color:var(--link);text-decoration:none}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.badge{font-size:12px;font-weight:650;padding:3px 8px;border-radius:8px;background:var(--line)}
.s-new{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
.s-in_work{background:color-mix(in srgb,var(--warn) 20%,transparent);color:#b87300}
.s-done{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.s-canceled{background:color-mix(in srgb,var(--danger) 14%,transparent);color:var(--danger)}
.badge.paid{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.badge.offb{background:var(--line);color:var(--hint)}

.seg{display:flex;background:var(--line);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:9px;font-weight:600;font-size:14px;color:var(--hint)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:0;background:var(--card);border-radius:20px;padding:7px 12px;font-size:13.5px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--accent);color:var(--accent-text)}
.chip b{opacity:.7;margin-left:4px}
.stsel{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:12px}
.stsel button{border:0;background:var(--page);border-radius:9px;padding:8px 2px;font-size:12px;font-weight:600;color:var(--hint)}
.stsel button.on{color:#fff}
.stsel button.on.new{background:var(--accent)}.stsel button.on.in_work{background:var(--warn)}
.stsel button.on.done{background:var(--ok)}.stsel button.on.canceled{background:var(--danger)}
.svc-row{display:flex;align-items:center;gap:12px;cursor:pointer}
.chev{color:var(--hint);font-size:22px}
.wd-row{display:flex;align-items:center;gap:8px;padding:6px 0}
.sw{display:flex;align-items:center;gap:8px;width:136px;flex:none;text-transform:capitalize;font-size:14px}
.sw input,.check input{width:20px;height:20px;accent-color:var(--accent)}
.check{display:flex;align-items:center;gap:8px;margin-top:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 6px}
.grid3 label,.grid2 label{font-size:12px;color:var(--hint);display:flex;flex-direction:column;gap:5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.daypanel{border-top:1px solid var(--line);margin-top:8px;padding-top:12px}

.empty,.done{text-align:center;padding:40px 16px}
.big{font-size:52px;margin-bottom:6px}
.done p{margin:8px 0}
.loader{display:flex;justify-content:center;padding:28px}
.loader span{width:26px;height:26px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

#bar{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:var(--page);box-shadow:0 -6px 24px rgba(0,0,0,.08);display:none;z-index:10}
#bar .in{max-width:640px;margin:0 auto;display:flex;gap:12px;align-items:center}
#barInfo{flex:1;font-size:13px;color:var(--hint);line-height:1.25}
#barInfo b{display:block;color:var(--text);font-size:17px}
#barBtn{flex:1.3;border:0;background:var(--accent);color:var(--accent-text);border-radius:14px;padding:15px 12px;font-weight:700;font-size:15px}
#barBtn:disabled{opacity:.45}
#toast{position:fixed;left:50%;top:14px;transform:translate(-50%,-90px);background:#1d2433;color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;z-index:50;transition:transform .25s;max-width:90vw;box-shadow:0 6px 24px rgba(0,0,0,.2)}
#toast.show{transform:translate(-50%,0)}
#toast.bad{background:var(--danger)}

/* ---- витрина в стиле маркетплейса ---- */
.note{display:flex;gap:10px;align-items:flex-start;background:var(--card);border-radius:14px;padding:11px 13px;font-size:13px;color:var(--hint);margin:12px 0 4px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 10px}
@media (min-width:560px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.pcard{background:var(--card);border-radius:18px;padding:6px 6px 12px;cursor:pointer;position:relative;outline:2px solid transparent;transition:outline-color .15s,transform .12s;display:flex;flex-direction:column}
.pcard:active{transform:scale(.985)}
.pcard.on{outline-color:var(--accent)}
.pimg{position:relative;border-radius:14px;overflow:hidden;background:#ececef;aspect-ratio:266/230;display:grid;place-items:center}
.pimg img{width:100%;height:100%;object-fit:cover;display:block}
.pemo{font-size:52px}
.padd{position:absolute;right:8px;bottom:8px;width:42px;height:42px;border-radius:13px;border:0;background:#ffd21f;color:#1a1a1a;display:grid;place-items:center;box-shadow:0 3px 10px rgba(0,0,0,.18);transition:background .15s,transform .15s;pointer-events:none}
.pcard.on .padd{background:var(--accent);color:var(--accent-text);transform:scale(1.05)}
.padd svg{width:22px;height:22px}
.pos{position:absolute;left:8px;top:8px;background:rgba(255,255,255,.92);color:#333;font-size:11px;font-weight:700;padding:3px 7px;border-radius:7px}
.pprice{font-size:20px;font-weight:800;color:#e5222e;margin:10px 6px 2px;letter-spacing:-.01em}
.ptitle{font-size:14px;line-height:1.3;margin:0 6px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pmeta{font-size:12.5px;color:var(--hint);margin:auto 6px 0;padding-top:7px;display:flex;gap:8px;flex-wrap:wrap}
.pmeta i{font-style:normal;display:inline-flex;align-items:center;gap:4px}
.dotg{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block}
.thumb{width:44px;height:38px;border-radius:9px;object-fit:cover;background:#ececef;flex:none}
.row .lt{display:flex;align-items:center;gap:10px;min-width:0}
.row .lt span{overflow:hidden;text-overflow:ellipsis}
.imgprev{width:100%;aspect-ratio:266/230;border-radius:14px;background:#ececef;display:grid;place-items:center;overflow:hidden;margin-bottom:8px;font-size:44px}
.imgprev img{width:100%;height:100%;object-fit:cover}
.filebtn{display:flex;gap:8px;align-items:center}
.filebtn input[type=file]{display:none}
@media (max-width:380px){.sw{width:112px}.st{font-size:11px}}
</style>
</head>
<body>
<div id="app"><div class="loader"><span></span></div></div>
<div id="bar"><div class="in"><div id="barInfo"></div><button id="barBtn"></button></div></div>
<div id="toast"></div>
<script>
const tg = window.Telegram && window.Telegram.WebApp;
const inTG = !!(tg && tg.initData);
if (inTG) {
  document.documentElement.setAttribute('data-tg', '1');
  tg.ready(); tg.expand();
  try { tg.setHeaderColor('secondary_bg_color'); tg.setBackgroundColor('secondary_bg_color'); } catch (e) {}
}
const qs = new URLSearchParams(location.search);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rub = n => Number(n).toLocaleString('ru-RU') + ' ₽';
const dur = m => { m = +m; const h = Math.floor(m / 60), r = m % 60; return h && r ? `${h} ч ${r} мин` : h ? `${h} ч` : `${r} мин`; };
const MONTHS = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const MONTHS_G = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const WD = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
const WD_FULL = ['понедельник','вторник','среда','четверг','пятница','суббота','воскресенье'];
const parseD = s => { const [y, m, d] = s.split('-').map(Number); return {y, m, d, wd: (new Date(Date.UTC(y, m - 1, d)).getUTCDay() + 6) % 7}; };
const dLabel = s => { const p = parseD(s); return `${WD[p.wd].toLowerCase()}, ${p.d} ${MONTHS_G[p.m - 1]}`; };
const haptic = () => { try { tg.HapticFeedback.impactOccurred('light'); } catch (e) {} };
const hapticOk = () => { try { tg.HapticFeedback.notificationOccurred('success'); } catch (e) {} };
const loader = () => '<div class="loader"><span></span></div>';
const empty = (msg, extra = '') => `<div class="empty"><div class="big">🗂</div><p>${msg}</p>${extra}</div>`;
const badge = (s, t) => `<span class="badge s-${s}">${esc(t)}</span>`;

function toast(msg, bad) {
  const t = $('#toast'); t.textContent = msg; t.className = 'show' + (bad ? ' bad' : '');
  clearTimeout(toast.t); toast.t = setTimeout(() => { t.className = bad ? 'bad' : ''; }, 2800);
}
async function api(path, method = 'GET', body) {
  const r = await fetch(path, {method, headers: {'Content-Type': 'application/json', 'X-Init-Data': (tg && tg.initData) || ''},
    body: body ? JSON.stringify(body) : undefined});
  let j = {}; try { j = await r.json(); } catch (e) {}
  if (!r.ok) throw new Error(j.error || `Ошибка ${r.status}`);
  return j;
}
const run = async fn => { try { await fn(); } catch (e) { toast(e.message, true); } };
const confirmBox = msg => new Promise(res => inTG && tg.showConfirm ? tg.showConfirm(msg, ok => res(!!ok)) : res(window.confirm(msg)));
function openInvoice(url) {
  if (inTG && tg.openInvoice) tg.openInvoice(url, st => {
    if (st === 'paid') { hapticOk(); toast('Оплата прошла успешно'); if (S.tab === 'my') loadMy(); }
    else if (st === 'failed') toast('Оплата не прошла', true);
  });
  else window.open(url, '_blank');
}

// ---------------- состояние ----------------
const S = {
  me: null, services: [], tab: 'shop', stack: ['catalog'],
  sel: new Set(), adds: new Set(), form: {phone: '', comment: ''},
  pick: null, lastOrder: null, busy: false, my: null, resched: null,
  adm: {sub: 'orders', status: 'new', orders: null, counts: {}, svcs: null, edit: null, sch: null, days: null, date: null, slots: null},
};
const view = () => S.stack[S.stack.length - 1];
const svc = id => S.services.find(s => s.id === id);
const mains = () => S.services.filter(s => !s.is_addon);
const addons = () => S.services.filter(s => s.is_addon);
function cart() {
  const items = [...S.sel, ...S.adds].map(svc).filter(Boolean);
  return {items, total: items.reduce((a, s) => a + s.price, 0), duration: Math.max(15, items.reduce((a, s) => a + s.duration_min, 0))};
}
function prune() {
  for (const id of [...S.sel]) if (!svc(id) || svc(id).is_addon) S.sel.delete(id);
  for (const id of [...S.adds]) if (!svc(id) || !svc(id).is_addon) S.adds.delete(id);
}
function setPath(p, v) { const k = p.split('.'); let o = S; for (let i = 0; i < k.length - 1; i++) o = o[k[i]]; o[k[k.length - 1]] = v; }

// ---------------- общие блоки ----------------
function tabsHtml() {
  const t = [['shop', '🛒 Услуги'], ['my', '📅 Мои записи']];
  if (S.me.is_admin) t.push(['admin', '⚙️ Админ']);
  return `<div class="tabs">${t.map(([k, l]) => `<button class="tab ${S.tab === k ? 'on' : ''}" data-act="tab" data-k="${k}">${l}</button>`).join('')}</div>`;
}
function steps(n) {
  const names = ['Услуги', 'Доп.', 'Время', 'Итог'];
  return `<div class="steps">${n ? '<button class="back" data-act="back">‹</button>' : ''}${names.map((x, i) =>
    `<div class="st ${i < n ? 'done' : ''} ${i === n ? 'cur' : ''}"><span>${i < n ? '✓' : i + 1}</span>${x}</div>`).join('')}</div>`;
}
function svcCard(s, on, act) {
  return `<div class="card svc ${on ? 'on' : ''}" data-act="${act}" data-id="${s.id}">
    <div class="emo">${esc(s.emoji)}</div>
    <div class="grow"><div class="svc-t">${esc(s.title)}</div>${s.description ? `<div class="svc-d">${esc(s.description)}</div>` : ''}
      <div class="svc-m"><b>${s.is_addon ? '+ ' : ''}${rub(s.price)}</b>${s.duration_min ? `<span>⏱ ${dur(s.duration_min)}</span>` : ''}</div></div>
    <div class="chk">${on ? '✓' : ''}</div></div>`;
}
function calendar(days, fn, act) {
  const byM = {};
  days.forEach(d => { const k = d.date.slice(0, 7); (byM[k] = byM[k] || []).push(d); });
  return Object.values(byM).map(arr => {
    const p = parseD(arr[0].date);
    return `<div class="cal-m">${MONTHS[p.m - 1]} ${p.y}</div><div class="cal">${WD.map(w => `<div class="cal-w">${w}</div>`).join('')}${'<div></div>'.repeat(p.wd)}${arr.map(d => {
        const o = fn(d);
        return `<button class="day ${o.cls || ''} ${o.on ? 'on' : ''}" ${o.dis ? 'disabled' : ''} data-act="${act}" data-d="${d.date}">${parseD(d.date).d}${o.dot ? '<i class="dot"></i>' : ''}</button>`;
      }).join('')}</div>`;
  }).join('');
}

// ---------------- клиент: оформление ----------------

// ---------------- загрузка данных ----------------
async function startPick(duration, exclude) {
  const prev = S.pick && S.pick.date;
  const p = S.pick = {duration, exclude, date: null, ts: null, days: null, slots: null};
  render();
  await run(async () => {
    const days = await api(`/api/days?duration=${duration}${exclude ? '&exclude=' + exclude : ''}`);
    if (S.pick !== p) return;
    p.days = days;
    const first = days.find(d => d.date === prev && d.free) || days.find(d => d.free);
    if (first) await loadSlots(first.date); else render();
  });
}
async function loadSlots(date) {
  const p = S.pick; p.date = date; p.ts = null; p.slots = null; render();
  await run(async () => {
    const r = await api(`/api/slots?date=${date}&duration=${p.duration}${p.exclude ? '&exclude=' + p.exclude : ''}`);
    if (S.pick === p && p.date === date) { p.slots = r; render(); }
  });
}
function toPick() { push('datetime'); startPick(cart().duration, null); }
async function submit() {
  const c = cart(); S.busy = true; updateBar();
  try {
    const r = await api('/api/orders', 'POST', {services: [...S.sel], addons: [...S.adds], ts: S.pick.ts, phone: S.form.phone, comment: S.form.comment});
    hapticOk(); S.lastOrder = r.order; S.stack = ['success']; S.sel.clear(); S.adds.clear(); S.form.comment = ''; S.pick = null; S.my = null;
    S.busy = false; render();
    if (r.invoice_url) openInvoice(r.invoice_url);
  } catch (e) {
    toast(e.message, true);
    if (/занято/.test(e.message)) { S.stack.pop(); startPick(c.duration, null); }
  } finally { S.busy = false; updateBar(); }
}
async function doResched() {
  S.busy = true; updateBar();
  try {
    await api(`/api/orders/${S.resched.id}/reschedule`, 'POST', {ts: S.pick.ts});
    hapticOk(); toast('Запись перенесена'); S.resched = null; S.pick = null; await loadMy();
  } catch (e) { toast(e.message, true); } finally { S.busy = false; updateBar(); }
}
async function loadMy() { await run(async () => { S.my = await api('/api/orders/my'); render(); }); }
async function admLoadOrders() {
  await run(async () => { const r = await api(`/api/admin/orders?status=${S.adm.status}`); S.adm.orders = r.orders; S.adm.counts = r.counts; render(); });
}
async function admLoadDays() { S.adm.days = await api('/api/admin/days'); }
async function admLoadSlots() { if (S.adm.date) S.adm.slots = await api(`/api/admin/slots?date=${S.adm.date}`); }
async function admLoad() {
  const s = S.adm.sub;
  if (s === 'orders') return admLoadOrders();
  if (s === 'services') return run(async () => { S.adm.svcs = await api('/api/services?all=1'); render(); });
  return run(async () => { S.adm.sch = schToForm(await api('/api/admin/schedule')); render(); await admLoadDays(); await admLoadSlots(); render(); });
}
async function refreshServices() {
  S.adm.svcs = await api('/api/services?all=1'); S.services = await api('/api/services'); prune(); render();
}
async function svcSave() {
  const e = S.adm.edit;
  const body = {title: e.title, description: e.description, price: +e.price || 0, duration_min: +e.duration_min || 0,
    is_addon: e.is_addon === '1', emoji: e.emoji, image: e.image || '', active: !!e.active, sort: +e.sort || 0};
  S.busy = true; updateBar();
  try {
    if (e.id) await api(`/api/admin/services/${e.id}`, 'PUT', body); else await api('/api/admin/services', 'POST', body);
    toast('Сохранено'); S.adm.edit = null; await refreshServices();
  } catch (err) { toast(err.message, true); } finally { S.busy = false; updateBar(); }
}

// ---------------- действия ----------------
const A = {
  tab({k}) { S.tab = k; S.resched = null; S.adm.edit = null; render(); if (k === 'my') loadMy(); if (k === 'admin') admLoad(); },
  back: goBack,
  selMain({id}) { id = +id; S.sel.has(id) ? S.sel.delete(id) : S.sel.add(id); haptic(); render(); },
  selAdd({id}) { id = +id; S.adds.has(id) ? S.adds.delete(id) : S.adds.add(id); haptic(); render(); },
  pickDate({d}) { haptic(); loadSlots(d); },
  pickTs({ts}) { S.pick.ts = +ts; haptic(); render(); },
  newOrder() { S.sel.clear(); S.adds.clear(); S.form.comment = ''; S.pick = null; S.stack = ['catalog']; render(); },
  async cancel({id}) {
    if (!await confirmBox('Отменить эту запись?')) return;
    await run(async () => { await api(`/api/orders/${id}/cancel`, 'POST'); toast('Запись отменена'); await loadMy(); });
  },
  resched({id}) { S.resched = S.my.find(x => x.id == id); S.pick = null; startPick(S.resched.duration_min, S.resched.id); },
  pay({id}) { run(async () => openInvoice((await api(`/api/orders/${id}/pay`, 'POST')).invoice_url)); },
  repeat({id}) {
    const o = S.my.find(x => x.id == id); S.sel.clear(); S.adds.clear();
    o.items.forEach(i => { const s = svc(i.id); if (s) (s.is_addon ? S.adds : S.sel).add(s.id); });
    S.tab = 'shop'; S.stack = ['catalog']; render();
    if (!S.sel.size) toast('Эти услуги больше недоступны', true);
  },
  admSub({k}) { S.adm.sub = k; S.adm.edit = null; render(); admLoad(); },
  admFilter({s}) { S.adm.status = s; S.adm.orders = null; render(); admLoadOrders(); },
  setSt({id, s}) { run(async () => { await api(`/api/admin/orders/${id}/status`, 'POST', {status: s}); haptic(); toast('Статус обновлён, клиент уведомлён'); await admLoadOrders(); }); },
  openTg({u}) { const url = 'https://t.me/' + u; inTG && tg.openTelegramLink ? tg.openTelegramLink(url) : window.open(url, '_blank'); },
  svcNew() { S.adm.edit = {title: '', description: '', price: 1000, duration_min: 60, is_addon: '0', emoji: '💻', image: '', active: true, sort: 0}; render(); },
  imgClear() { S.adm.edit.image = ''; render(); },
  svcEdit({id}) { const s = S.adm.svcs.find(x => x.id == id); S.adm.edit = {...s, is_addon: s.is_addon ? '1' : '0', active: !!s.active}; render(); },
  async svcDelete() {
    if (!await confirmBox('Удалить услугу? В старых заказах она сохранится.')) return;
    await run(async () => { await api(`/api/admin/services/${S.adm.edit.id}`, 'DELETE'); toast('Услуга удалена'); S.adm.edit = null; await refreshServices(); });
  },
  schSave() {
    run(async () => { S.adm.sch = schToForm(await api('/api/admin/schedule', 'PUT', formToSch(S.adm.sch))); toast('Расписание сохранено'); await admLoadDays(); await admLoadSlots(); render(); });
  },
  admDate({d}) { S.adm.date = d; S.adm.slots = null; render(); run(async () => { await admLoadSlots(); render(); }); },
  admDayOff() { run(async () => { await api('/api/admin/days/toggle', 'POST', {date: S.adm.date}); await admLoadDays(); await admLoadSlots(); haptic(); render(); }); },
  admSlot({ts, st, o}) {
    if (st === 'booked') { S.adm.sub = 'orders'; S.adm.status = ''; S.adm.orders = null; render(); admLoadOrders(); return toast('Заказ №' + o); }
    if (st === 'past') return;
    run(async () => { await api('/api/admin/slots/toggle', 'POST', {ts: +ts}); await admLoadSlots(); await admLoadDays(); haptic(); render(); });
  },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  if (el.tagName === 'A') e.preventDefault();
  const fn = A[el.dataset.act];
  if (fn) fn({...el.dataset});
});
const bind = e => { const b = e.target.dataset && e.target.dataset.bind; if (b) setPath(b, e.target.type === 'checkbox' ? e.target.checked : e.target.value); };
document.addEventListener('input', bind);
document.addEventListener('change', bind);

document.addEventListener('change', e => {
  if (e.target.id !== 'imgfile' || !e.target.files[0]) return;
  const f = e.target.files[0], rd = new FileReader();
  rd.onload = () => {
    const img = new Image();
    img.onload = () => run(async () => {
      const k = Math.min(1, 900 / Math.max(img.width, img.height));
      const cv = document.createElement('canvas'); cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      toast('Загружаем фото…');
      const r = await api('/api/admin/upload', 'POST', {data: cv.toDataURL('image/jpeg', 0.86)});
      S.adm.edit.image = r.url; render(); toast('Фото загружено');
    });
    img.onerror = () => toast('Не удалось прочитать изображение', true);
    img.src = rd.result;
  };
  rd.readAsDataURL(f);
});

// ---------------- старт ----------------
(async () => {
  try {
    S.me = await api('/api/me');
    S.services = await api('/api/services');
    S.form.phone = (S.me.user && S.me.user.phone) || '';
    const v = qs.get('v') || (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param);
    if (v === 'my') { S.tab = 'my'; render(); loadMy(); }
    else if (v === 'admin' && S.me.is_admin) { S.tab = 'admin'; render(); admLoad(); }
    else render();
  } catch (e) {
    $('#app').innerHTML = empty(esc(e.message), '<p class="hint">Откройте магазин через кнопку в боте.</p>');
  }
})();
</script>
</body>
